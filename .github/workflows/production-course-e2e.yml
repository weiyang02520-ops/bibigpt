name: Production course E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  course-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install test runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/bibigpt-test-runtime" --package-lock=false --ignore-scripts --no-audit --no-fund @playwright/test@1.54.1 tsx@4.20.3
          node "$RUNNER_TEMP/bibigpt-test-runtime/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Validate Obsidian merger contract
        run: NODE_PATH="$RUNNER_TEMP/bibigpt-test-runtime/node_modules" node "$RUNNER_TEMP/bibigpt-test-runtime/node_modules/tsx/dist/cli.mjs" tests/obsidian-vault.integration.ts

      - name: Run production course workflow
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: NODE_PATH="$RUNNER_TEMP/bibigpt-test-runtime/node_modules" node "$RUNNER_TEMP/bibigpt-test-runtime/node_modules/@playwright/test/cli.js" test tests/production-course.spec.ts --config=playwright.config.cjs --reporter=line --workers=1

      - name: Validate Obsidian bundle
        if: success()
        run: |
          node scripts/validate-obsidian-vault.mjs artifacts/production-course/course-notes.zip
          node scripts/validate-obsidian-vault.mjs artifacts/production-course/course-notes-rerun.zip
          node scripts/validate-obsidian-vault.mjs artifacts/production-course/course-notes-updated.zip
          unzip -q artifacts/production-course/course-notes.zip -d artifacts/production-course/obsidian
          test -s 'artifacts/production-course/obsidian/BibiGPT-Vault/00_课程索引.md'
          test -s artifacts/production-course/obsidian/BibiGPT-Vault/manifest.json
          test -s artifacts/production-course/obsidian/BibiGPT-Vault/lessons/bilibili-BV1ySLc6QEcB-p1.md
          test -s artifacts/production-course/obsidian/BibiGPT-Vault/transcripts/bilibili-BV1ySLc6QEcB-p1.md
          test -s artifacts/production-course/obsidian/BibiGPT-Vault/review/bilibili-BV1ySLc6QEcB-p1.md
          test "$(find artifacts/production-course/obsidian/BibiGPT-Vault/assets/bilibili-BV1ySLc6QEcB-p1 -type f | wc -l)" -ge 3
          grep --fixed-strings --quiet 'Git + GitHub 课程笔记验收' artifacts/production-course/obsidian/BibiGPT-Vault/lessons/bilibili-BV1ySLc6QEcB-p1.md

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-course-evidence
          path: |
            artifacts/production-course
            test-results
          if-no-files-found: warn
          retention-days: 7
